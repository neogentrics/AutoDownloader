name: Build and Publish Release

on:
  # Tag filters belong on the push event. The previous config used the "create" event
  # with a tags filter, which that event does not support - it fires for every branch
  # and tag creation instead.
  push:
    branches: [ "master" ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write # required to create a release

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Name: AutoDownloader.sln
      Publish_Project_Path: AutoDownloader.UI/AutoDownloader.UI.csproj

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Analyze Tag for Release Type
        id: tag_analysis
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          $isPreRelease = $tagName -match "-alpha|-beta|-rc"

          if ($isPreRelease) {
            $releaseName = "Pre-Release $tagName (Alpha/Beta)"
          } else {
            $releaseName = "Release $tagName - Stable"
          }

          # PowerShell writes a boolean as "True", which the release action does not read
          # as a boolean - so a -beta tag was published as a full release. Lowercase it.
          $preReleaseFlag = $isPreRelease.ToString().ToLower()
          "IS_PRERELEASE=$preReleaseFlag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "RELEASE_NAME=$releaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "TAG_NAME=$tagName"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Restore/build via the dotnet CLI throughout. The previous msbuild step passed
      # /p:RestorePackagesConfig=true, which is for packages.config projects; these are
      # all SDK-style PackageReference projects.
      - name: Restore
        run: dotnet restore ${{ env.Solution_Name }}

      - name: Build
        run: dotnet build ${{ env.Solution_Name }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.Solution_Name }} --configuration Release --no-build --verbosity normal

      - name: Publish AutoDownloader.UI
        run: >
          dotnet publish ${{ env.Publish_Project_Path }}
          -c Release -r win-x64 --self-contained true
          -o ${{ github.workspace }}/publish_output

      # The CLI ships alongside the app, into the same folder, so it can reuse the
      # tools the app provisions (yt-dlp, aria2c, ffmpeg) instead of downloading a
      # second copy of each.
      - name: Publish AutoDownloader.Cli
        run: >
          dotnet publish AutoDownloader.Cli/AutoDownloader.Cli.csproj
          -c Release -r win-x64 --self-contained true
          -o ${{ github.workspace }}/publish_output

      # Playwright browsers are installed into the published output so the distributed
      # artifact is ready to run without a first-launch download.
      - name: Install Playwright browsers into the artifact
        shell: pwsh
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/publish_output/.playwright
        run: |
          $script = "${{ github.workspace }}/publish_output/playwright.ps1"
          if (Test-Path $script) {
            & $script install chromium
          } else {
            Write-Warning "playwright.ps1 not found in the published output; skipping."
          }

      - name: Zip Published Output for Release
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ${{ github.workspace }}/publish_output/* `
            -DestinationPath ${{ github.workspace }}/AutoDownloader_${{ github.ref_name }}.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoDownloader-${{ github.sha }}
          path: ${{ github.workspace }}/publish_output

      - name: Create GitHub Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag_analysis.outputs.TAG_NAME }}
          name: ${{ steps.tag_analysis.outputs.RELEASE_NAME }}
          # The old body pointed at "the project page", which was the GitHub Pages site
          # that has since been retired. Notes are generated from the commits instead,
          # so a release describes itself rather than linking somewhere that is gone.
          body: |
            Windows build of AutoDownloader ${{ github.ref_name }}.

            Download `AutoDownloader_${{ github.ref_name }}.zip` below and run
            `AutoDownloader.exe`. The headless CLI, `autodl.exe`, ships in the same
            folder. Both are self-contained, so no .NET install is needed.

            See the [README](https://github.com/neogentrics/AutoDownloader#readme) for
            setup and the [issue register](https://github.com/neogentrics/AutoDownloader/blob/master/docs/ISSUE-REGISTER.md)
            for what is fixed and what is still open.
          generate_release_notes: true
          prerelease: ${{ steps.tag_analysis.outputs.IS_PRERELEASE }}
          files: |
            AutoDownloader_${{ github.ref_name }}.zip
